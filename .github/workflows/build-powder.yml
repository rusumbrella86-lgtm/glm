name: Build powder.html
on:
  push:
    branches: [main]
    paths:
      - 'powder-toy-game-concept/**'
      - '.github/workflows/build-powder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: powder-toy-game-concept
      - run: npm run build
        working-directory: powder-toy-game-concept
      - run: cp powder-toy-game-concept/dist/index.html powder.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Build powder.html from Vite'
          file_pattern: powder.html
